    dbData = jsonData;

    cloudAppDatabase.rules = (jsonData.rules && jsonData.rules.length > 0) ? jsonData.rules : defaultDatabase.rules;
  }

  function loadFromLocalCache() {
    try {
      const cached = localStorage.getItem(STORAGE_KEY_DB);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && parsed.status === "success") {
          applyDatabaseToMemory(parsed);
          return true;
        }
      }
    } catch(e) {
      console.warn("讀取快取失敗:", e);
    }
    return false;
  }

  function saveToLocalCache(dataObj) {
    try {

  function goToCIStage(targetStepOrder) {

  function bindAssetEvents() {
    const rows = document.querySelectorAll('.asset-input-row');
    rows.forEach(row => {
      const chk = row.querySelector('input[type="checkbox"]');
      const valInput = row.querySelector('.asset-input-val');
      const leftArea = row.querySelector('.asset-left-area');
      if (leftArea && chk && valInput) {
        leftArea.onclick = function(e) {
          if (e.target !== chk) chk.checked = !chk.checked;
          if (!chk.checked) valInput.value = '0';
          else if (parseNum(valInput.value) === 0) valInput.value = '500,000';
          row.classList.toggle('selected', chk.checked);
          updateAllAssets();
        };
        chk.onclick = function(e) {
          e.stopPropagation();
          if (!this.checked) valInput.value = '0';
          else if (parseNum(valInput.value) === 0) valInput.value = '500,000';
          row.classList.toggle('selected', this.checked);
          updateAllAssets();
        };
        valInput.oninput = function() {
          let num = parseNum(this.value);
          this.value = num.toLocaleString();
          chk.checked = num > 0;
          row.classList.toggle('selected', chk.checked);
          updateAllAssets();
        };
      }
    });
  }

  function onExpenseInputChanged(el) { ciState.monthlyExp = parseNum(el.value); el.value = ciState.monthlyExp.toLocaleString(); recalculateAll(); }
  function onMonthsInputChanged(el) { ciState.months = parseNum(el.value) || 36; recalculateAll(); }
  function onExistingCIInputChanged(el) { ciState.existingCI = parseNum(el.value); el.value = ciState.existingCI.toLocaleString(); recalculateAll(); }

  function recalculateAll() {
    ciState.totalNeed = ciState.monthlyExp * ciState.months;
    ciState.netGap = Math.max(0, ciState.totalNeed - ciState.existingCI);
    const aNeed = document.getElementById('a-total-need');
    const bGap = document.getElementById('b-gap-val');
    if (aNeed) aNeed.innerText = 'HK$ ' + ciState.totalNeed.toLocaleString();
    if (bGap) bGap.innerText = 'HK$ ' + ciState.netGap.toLocaleString();
    
    const supportMonths = ciState.monthlyExp > 0 ? (ciState.existingCI / ciState.monthlyExp).toFixed(1) : 0;
    const bSupport = document.getElementById('b-months-support');
    if (bSupport) bSupport.innerText = supportMonths;
    const bCiTxt = document.getElementById('b-ci-text');
    const bExpTxt = document.getElementById('b-exp-text');
    if (bCiTxt) bCiTxt.innerText = '$' + Math.round(ciState.existingCI/1000) + 'K';
    if (bExpTxt) bExpTxt.innerText = '$' + Math.round(ciState.monthlyExp/1000) + 'K';

    updateAllAssets();
  }

  function updateAllAssets() {
    let sumVal = 0;
    const rows = document.querySelectorAll('.asset-input-row');
    rows.forEach(row => {
      const chk = row.querySelector('input[type="checkbox"]');
      const valInput = row.querySelector('.asset-input-val');
      if (chk && valInput && chk.checked) sumVal += parseNum(valInput.value);
    });
    ciState.totalChosenAssets = sumVal;
    const remainGap = Math.max(0, ciState.netGap - sumVal);
    const bAssetTot = document.getElementById('b-asset-total-display');
    const bAssetRemain = document.getElementById('b-asset-remain-gap');
    if (bAssetTot) bAssetTot.innerText = 'HK$ ' + sumVal.toLocaleString();
    if (bAssetRemain) bAssetRemain.innerText = 'HK$ ' + remainGap.toLocaleString();
    
    const formulaEl = document.getElementById('b-asset-formula-text');
    if (formulaEl) formulaEl.innerText = `(生活缺口 HK$ ${ciState.netGap.toLocaleString()} － 計劃動用資產 HK$ ${sumVal.toLocaleString()})`;
    
    const cAssets = document.getElementById('c-summary-assets');
    const cRemain = document.getElementById('c-summary-remain-gap');
    if (cAssets) cAssets.innerText = 'HK$ ' + sumVal.toLocaleString();
    if (cRemain) cRemain.innerText = 'HK$ ' + remainGap.toLocaleString();
  }

  function runStage3Calculation() {
    const startAgeEl = document.getElementById('c-input-start-age');
    const claimAgeEl = document.getElementById('c-input-claim-age');
    if (startAgeEl) ciState.simStartAge = parseInt(startAgeEl.value, 10) || 20;
    if (claimAgeEl) ciState.simClaimAge = parseInt(claimAgeEl.value, 10) || 25;

    const sceSum = ciState.sceSum;
    const oys2Sum = ciState.oys2Sum;
    const isWithin10Years = (ciState.simClaimAge - ciState.simStartAge <= 10);
    const bonusRate = ciState.isChildMode ? 0.5 : ((ciState.simStartAge <= 30) ? 0.5 : 0.35);
    const oys2BonusVal = isWithin10Years ? Math.round(oys2Sum * bonusRate) : 0;
    const oys2FirstDisplay = oys2Sum + oys2BonusVal;
    
    const sceFirstClaim = document.getElementById('c-sce-first-claim');
    const oys2FirstClaim = document.getElementById('c-oys2-first-claim');
    if (sceFirstClaim) sceFirstClaim.innerText = 'HK$ ' + sceSum.toLocaleString();
    if (oys2FirstClaim) oys2FirstClaim.innerText = 'HK$ ' + oys2FirstDisplay.toLocaleString();
    
    const bonusRateEl = document.getElementById('c-oys2-bonus-rate');
    if (bonusRateEl) bonusRateEl.innerText = `+${Math.round(bonusRate * 100)}% ($${oys2BonusVal.toLocaleString()})`;

    const linkRemainGap = document.getElementById('c-link-remain-gap');
    const linkStatusNote = document.getElementById('c-link-status-note');
    if (linkRemainGap) linkRemainGap.innerText = 'HK$ ' + oys2FirstDisplay.toLocaleString();
    if (linkStatusNote) {
      const remainLifeGap = Math.max(0, ciState.netGap - oys2FirstDisplay);
      if (remainLifeGap === 0 && oys2FirstDisplay > 0) {
        linkStatusNote.innerText = `（所選理賠 HK$ ${oys2FirstDisplay.toLocaleString()} 已全額覆蓋 HK$ ${ciState.netGap.toLocaleString()} 生活缺口 ✅）`;
        linkStatusNote.style.color = '#059669';
      } else {
        linkStatusNote.innerText = `（所選理賠 HK$ ${oys2FirstDisplay.toLocaleString()}，尚欠生活資金 HK$ ${remainLifeGap.toLocaleString()}）`;
        linkStatusNote.style.color = '#dc2626';
      }
    }
    ciState.oys2MultiPaid = oys2FirstDisplay;
  }

  function getRateFromTable(product, age, gender, period) {
    const r = dbData.rates || fallbackRates;
    if (product === 'sce') {
      const t = (gender === 'F') ? r.sce_f : r.sce_m;
      if (t && t[age] && t[age].non_smoker) return t[age].non_smoker;
      return 2.03;
    }
    if (product === 'oys2') {
      const t = (gender === 'F') ? r.oys2_f : r.oys2_m;
      if (t && t[age]) {
        if (period === 10) return t[age].pay10_non || 39.8;
        if (period === 25) return t[age].pay25_non || 19.3;
        return t[age].pay18_non || 24.62;
      }
      return 24.62;
    }
    return 0;
  }

  function calculateCIPremium() {
    const ageEl = document.getElementById('ci-calc-age');
    const genderEl = document.getElementById('ci-calc-gender');
    if (!ageEl || !genderEl) return;
    
    const age = parseInt(ageEl.value, 10) || 20;
    const gender = genderEl.value || 'M';
    const period = ciState.oys2PayPeriod;
    const vitalityChk = document.getElementById('ci-calc-vitality');
    const isVitality = vitalityChk ? vitalityChk.checked : false;
    
    const sceRate = getRateFromTable('sce', age, gender, period);
    let finalSceHkd = Math.round((ciState.sceSum / 7800) * sceRate);
    if (isVitality) finalSceHkd = Math.round(finalSceHkd * 0.9);
    
    const oys2Rate = getRateFromTable('oys2', age, gender, period);
    let finalOys2Hkd = Math.round((ciState.oys2Sum / 7800) * oys2Rate);
    
    ciState.annualPremMap = { sce: finalSceHkd, oys2: finalOys2Hkd };
    
    const premSceDisp = document.getElementById('prem-sce-display');
    const premOys2Disp = document.getElementById('prem-oys2-display');
    if (ciState.premiumMode === 'annual') {
      if (premSceDisp) premSceDisp.innerText = 'HK$ ' + finalSceHkd.toLocaleString() + ' /年';
      if (premOys2Disp) premOys2Disp.innerText = 'HK$ ' + finalOys2Hkd.toLocaleString() + ' /年';
    } else {
      let sceM = Math.round((finalSceHkd * 1.06) / 12);
      let oys2M = Math.round((finalOys2Hkd * 1.06) / 12);
      if (premSceDisp) premSceDisp.innerText = 'HK$ ' + sceM.toLocaleString() + ' /月';
      if (premOys2Disp) premOys2Disp.innerText = 'HK$ ' + oys2M.toLocaleString() + ' /月';
    }
    
    renderProjectionTable(age, gender, isVitality, period);
    updateConfirmSummary();
  }

  function toggleVitalityDetails() {
    const box = document.getElementById('vitality-details-content');
    const arrow = document.getElementById('vitality-arrow-icon');
    if (!box) return;
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    if (arrow) arrow.innerText = (box.style.display === 'block') ? '▲ 點擊收起說明' : '▼ 點擊展開說明';
  }

  function renderProjectionTable(startAge, gender, isVitality, period) {
    const tbody = document.getElementById('projection-table-body');
    if (!tbody) return;
    let html = '';
    let totalScePaid = 0;
    let totalOys2Paid = 0;
    for (let age = startAge; age <= 80; age += 5) {
      let stepYears = 5;
      let sceRate = getRateFromTable('sce', age, gender, period);
      let sceAnnualAtAge = Math.round((ciState.sceSum / 7800) * sceRate);
      if (isVitality) sceAnnualAtAge = Math.round(sceAnnualAtAge * 0.9);
      totalScePaid += (sceAnnualAtAge * stepYears);
      let elapsed = age - startAge;
      let oys2AnnualAtAge = 0;
      if (elapsed < period) {
        let oys2Rate = getRateFromTable('oys2', startAge, gender, period);
        oys2AnnualAtAge = Math.round((ciState.oys2Sum / 7800) * oys2Rate);
        let yearsInBlock = Math.min(stepYears, period - elapsed);
        totalOys2Paid += (oys2AnnualAtAge * yearsInBlock);
      }
      html += `
        <tr>
          <td style="text-align:left;"><strong>${age} 歲</strong></td>
          <td>HK$ ${sceAnnualAtAge.toLocaleString()}</td>
          <td style="color:#27ae60;">${oys2AnnualAtAge > 0 ? 'HK$ ' + oys2AnnualAtAge.toLocaleString() : '<span style="color:#64748b;">$0 (已供滿)</span>'}</td>
        </tr>`;
    }
    tbody.innerHTML = html;
    const tabTotSce = document.getElementById('table-total-sce');
    const tabTotOys2 = document.getElementById('table-total-oys2');
    if (tabTotSce) tabTotSce.innerText = 'HK$ ' + totalScePaid.toLocaleString();
    if (tabTotOys2) tabTotOys2.innerText = 'HK$ ' + totalOys2Paid.toLocaleString();
  }

  function onStage5AgeChanged(input) {
    const val = parseInt(input.value, 10) || 20;
    ciState.simStartAge = val;
    calculateCIPremium();
    runStage3Calculation();
  }

  function updateConfirmSummary() {
    const period = ciState.oys2PayPeriod;
    const planNameEl = document.getElementById('f-confirm-plan-name');
    const finalPremEl = document.getElementById('f-confirm-prem');
    const fGap = document.getElementById('f-confirm-gap');
    const fNeed = document.getElementById('f-confirm-need');
    const fExist = document.getElementById('f-confirm-existing');
    if (fGap) fGap.innerText = 'HK$ ' + ciState.netGap.toLocaleString();
    if (fNeed) fNeed.innerText = 'HK$ ' + ciState.totalNeed.toLocaleString();
    if (fExist) fExist.innerText = 'HK$ ' + ciState.existingCI.toLocaleString();
    
    let comboAnnual = 0;
    let comboTitles = [];
    if (ciState.chooseSce) {
      comboAnnual += ciState.annualPremMap.sce;
      comboTitles.push(`簡護危疾保 (SCE) ｜ 保額：HK$ ${ciState.sceSum.toLocaleString()}`);
    }
    if (ciState.chooseOys2) {
      comboAnnual += ciState.annualPremMap.oys2;
      comboTitles.push(`愛伴航2 (OYS2 ${period}年供款) ｜ 保額：HK$ ${ciState.oys2Sum.toLocaleString()}`);
    }
    let displayPrem = ciState.premiumMode === 'annual' ? 'HK$ ' + comboAnnual.toLocaleString() + ' /年' : 'HK$ ' + Math.round((comboAnnual * 1.06) / 12).toLocaleString() + ' /月';
    if (planNameEl) planNameEl.innerText = comboTitles.length > 0 ? comboTitles.join(' ＋ ') : '未選擇任何方案';
    if (finalPremEl) finalPremEl.innerText = displayPrem;
    
    syncGoalDisplay();
    
    const medBtn = document.getElementById('f-med-app-btn');
    if (medBtn) {
      const isChild = ciState.isChildMode;
      const roleVal = isChild ? 'child' : 'adult';
      const medBase = (dbData.config && dbData.config["醫療App網址"]) || "https://ivancww.github.io/medicalclaims";
      medBtn.href = `${medBase.trim().replace(/\/+$/, '')}?role=${roleVal}&cost=${ciState.medCost || 500000}&hasCompany=${ciState.hasCompanyMed || 'no'}`;
    }
  }

  function syncGoalDisplay() {
    ciState.goals = [];
    document.querySelectorAll('#assets-list-container .asset-input-row.selected').forEach(row => {
      const titleSpan = row.querySelector('.asset-left-area span');
      if (titleSpan) ciState.goals.push(titleSpan.innerText.trim());
    });
    if (ciState.goals.length === 0) ciState.goals = [ciState.isChildMode ? '全天候全職陪伴' : '家庭生活質素'];
    const fGoals = document.getElementById('f-confirm-goals');
    if (fGoals) fGoals.innerText = ciState.goals.join('、');
  }

  // ======================== 04 頁多重賠償時間線 ========================
  function renderMultiButtonsFromRules() {
    const botContainer = document.getElementById('botEmojiBtnContainer');
    if (!botContainer) return;
    let botHtml = '';
    const rules = (cloudAppDatabase.rules && cloudAppDatabase.rules.length > 0) ? cloudAppDatabase.rules : defaultDatabase.rules;
    rules.forEach(rule => {
      if (ciState.countsMap[rule.claimKey] === undefined) ciState.countsMap[rule.claimKey] = 0;
      const bColor = rule.color || '#d97706';
      const bEmoji = rule.emoji || '🛡️';
      const bName = rule.name || '理賠項目';
      botHtml += `<button type="button" class="btn-emoji-inline" style="background:${bColor};" onclick="executeDynamicClaim('${rule.claimKey}')" title="${bName}">${bEmoji}</button>`;
    });
    botHtml += `<button type="button" class="btn-emoji-inline" style="background:#64748b;" onclick="undoLastMultiClaim()" title="撤銷上一筆">↩️</button>`;
    botContainer.innerHTML = botHtml;
  }

  function executeDynamicClaim(claimKey) {
    const rules = (cloudAppDatabase.rules && cloudAppDatabase.rules.length > 0) ? cloudAppDatabase.rules : defaultDatabase.rules;
    const rule = rules.find(r => r.claimKey === claimKey);
    if (!rule) return;
    const listOys2 = document.getElementById('d-timeline-oys2');
    const sum = ciState.oys2Sum;
    const currentCount = ciState.countsMap[claimKey] || 0;
    const maxCount = parseInt(rule.maxCount, 10) || 6;
    if (currentCount >= maxCount) { alert(`${rule.name || '此項目'} 已達最高理賠上限 (${maxCount} 次)！`); return; }
    ciState.countsMap[claimKey] = currentCount + 1;
    const waitYears = parseInt(rule.waitYears, 10) || 1;
    ciState.multiTimelineAge += waitYears;
    let amt = (claimKey === 'cancer_b') ? Math.round(sum * 0.05) : sum;
    let desc = (claimKey === 'cancer_b') ? `發放每月 5% 津貼 ($${amt.toLocaleString()})` : `發放 100% 賠償 ($${amt.toLocaleString()})`;
    ciState.oys2MultiPaid += amt;
    const record = {
      claimKey: claimKey, amt: amt, ageBefore: ciState.multiTimelineAge - waitYears,
      html: `<div class="timeline-mini-card" style="border-left:5px solid ${rule.color || '#d97706'} !important;"><div><strong>${rule.name || '理賠項目'} (${ciState.multiTimelineAge}歲)</strong>：${desc}<br><span style="color:${rule.color || '#d97706'}; font-weight:bold;">✅ 多重現金流到位</span></div></div>`
    };
    ciState.claimHistory.push(record);
    if (listOys2) listOys2.insertAdjacentHTML('beforeend', record.html);
    const oys2TotPaid = document.getElementById('d-oys2-total-paid');
    if (oys2TotPaid) oys2TotPaid.innerText = 'HK$ ' + ciState.oys2MultiPaid.toLocaleString();
  }

  function undoLastMultiClaim() {
    if (ciState.claimHistory.length === 0) return;
    const last = ciState.claimHistory.pop();
    ciState.oys2MultiPaid -= last.amt;
    ciState.multiTimelineAge = last.ageBefore;
    ciState.countsMap[last.claimKey]--;
    const listOys2 = document.getElementById('d-timeline-oys2');
    const isWithin10 = (ciState.simClaimAge - ciState.simStartAge <= 10);
    const bonusRate = ciState.isChildMode ? 0.5 : ((ciState.simStartAge <= 30) ? 0.5 : 0.35);
    const firstClaimVal = ciState.oys2Sum + (isWithin10 ? Math.round(ciState.oys2Sum * bonusRate) : 0);
    let baseHtml = `<div class="timeline-mini-card" style="border-left:5px solid #27ae60 !important;"><div><strong>首次確診 (${ciState.simClaimAge}歲)</strong>：發放 $${firstClaimVal.toLocaleString()} (含升級)<br><span style="color:#27ae60; font-weight:bold;">✅ 豁免保費，多重持續生效至85歲</span></div></div>`;
    ciState.claimHistory.forEach(r => { baseHtml += r.html; });
    if (listOys2) listOys2.innerHTML = baseHtml;
    const oys2TotPaid = document.getElementById('d-oys2-total-paid');
    if (oys2TotPaid) oys2TotPaid.innerText = 'HK$ ' + ciState.oys2MultiPaid.toLocaleString();
  }

  function resetCompareMultiTimeline() {
    ciState.multiTimelineAge = ciState.simClaimAge;
    ciState.claimHistory = [];
    Object.keys(ciState.countsMap).forEach(k => { ciState.countsMap[k] = 0; });
    runStage3Calculation();
    const isWithin10 = (ciState.simClaimAge - ciState.simStartAge <= 10);
    const bonusRate = ciState.isChildMode ? 0.5 : ((ciState.simStartAge <= 30) ? 0.5 : 0.35);
    const firstClaimVal = ciState.oys2Sum + (isWithin10 ? Math.round(ciState.oys2Sum * bonusRate) : 0);
    const tlSce = document.getElementById('d-timeline-sce');
    const tlOys2 = document.getElementById('d-timeline-oys2');
    if (tlSce) tlSce.innerHTML = `<div class="timeline-mini-card" style="border-left:5px solid #34495e !important;"><div><strong>首次確診 (${ciState.simClaimAge}歲)</strong>：發放 $${ciState.sceSum.toLocaleString()}<br><span style="color:#e74c3c; font-weight:bold;">⚠️ 合約正式完結，無後續多重賠償</span></div></div>`;
    if (tlOys2) tlOys2.innerHTML = `<div class="timeline-mini-card" style="border-left:5px solid #27ae60 !important;"><div><strong>首次確診 (${ciState.simClaimAge}歲)</strong>：發放 $${firstClaimVal.toLocaleString()} (含升級)<br><span style="color:#27ae60; font-weight:bold;">✅ 豁免保費，多重持續生效至85歲</span></div></div>`;
    const oys2TotPaid = document.getElementById('d-oys2-total-paid');
    if (oys2TotPaid) oys2TotPaid.innerText = 'HK$ ' + firstClaimVal.toLocaleString();
    renderMultiButtonsFromRules();
  }

  // ======================== 後台管理 (完整支援選項與圖片編輯) ========================
  function openAdminModal() { document.getElementById('adminFullScreenModal').style.display = 'flex'; renderAdminVisualLayout(); renderAdminConfigLayout(); renderAdminRulesLayout(); }
  function closeAdminModal() { document.getElementById('adminFullScreenModal').style.display = 'none'; }
  function switchAdminTab(tabKey, btn) {
    document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('adminTabPagesSection').style.display = (tabKey === 'pages') ? 'block' : 'none';
    document.getElementById('adminTabConfigSection').style.display = (tabKey === 'config') ? 'block' : 'none';
    document.getElementById('adminTabRulesSection').style.display = (tabKey === 'rules') ? 'block' : 'none';
    if (tabKey === 'pages') renderAdminVisualLayout();
    if (tabKey === 'config') renderAdminConfigLayout();
    if (tabKey === 'rules') renderAdminRulesLayout();
  }

  function movePageOrder(role, currentIndex, direction) {
    saveCurrentAdminInputs();
    const rolePages = dbData.pages.filter(p => p.role === role).sort((a,b) => a.stepOrder - b.stepOrder);
    const targetIndex = currentIndex + direction;
    if (targetIndex < 0 || targetIndex >= rolePages.length) return;
    const tempOrder = rolePages[currentIndex].stepOrder;
    rolePages[currentIndex].stepOrder = rolePages[targetIndex].stepOrder;
    rolePages[targetIndex].stepOrder = tempOrder;
    renderAdminVisualLayout();
  }

  function saveCurrentAdminInputs() {
    document.querySelectorAll('[data-adm-page-idx]').forEach(card => {
      const idx = Number(card.dataset.admPageIdx);
      if (dbData.pages[idx]) {
        dbData.pages[idx].stepOrder = Number(card.querySelector('.adm-order-inp').value) || dbData.pages[idx].stepOrder;
        dbData.pages[idx].tagName = card.querySelector('.adm-tag-inp').value;
        dbData.pages[idx].title = card.querySelector('.adm-title-inp').value;
        dbData.pages[idx].highlightText = card.querySelector('.adm-hl-inp').value;
        dbData.pages[idx].subtitle = card.querySelector('.adm-sub-inp').value;
        dbData.pages[idx].imageUrl = card.querySelector('.adm-img-inp').value;
      }
    });
  }

  function renderAdminVisualLayout() {
    const container = document.getElementById('adminVisualContainer');
    const selectedRole = document.getElementById('adminRoleSelect').value;
    const rolePages = dbData.pages.filter(p => p.role === selectedRole);
    rolePages.sort((a,b) => Number(a.stepOrder) - Number(b.stepOrder));
    let html = '';
    rolePages.forEach((p, rIdx) => {
      const realIdx = dbData.pages.indexOf(p);
      html += `
        <div class="admin-card-section" data-adm-page-idx="${realIdx}">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:6px;">
              <strong style="color:var(--primary); font-size:15px;">步驟</strong>
              <input type="number" class="adm-order-inp" value="${p.stepOrder}" style="width:60px; text-align:center; padding:4px;" onchange="saveCurrentAdminInputs(); renderAdminVisualLayout();">
              <button type="button" class="btn-move" onclick="movePageOrder('${selectedRole}', ${rIdx}, -1)">⬆️ 上移</button>
              <button type="button" class="btn-move" onclick="movePageOrder('${selectedRole}', ${rIdx}, 1)">⬇️ 下移</button>
            </div>
            <div style="display:flex; gap:6px;">
              <input type="text" class="adm-tag-inp" value="${p.tagName}" style="width:160px; margin-top:0;" placeholder="步驟標籤">
              <button type="button" onclick="deleteAdminCIPage(${realIdx})" style="background:#fee2e2; color:#dc2626; border:1px solid #ef4444; border-radius:6px; padding:2px 8px; font-size:11px; cursor:pointer;">🗑️ 刪除</button>
            </div>
          </div>
          <div style="margin-top:8px;"><label class="admin-label">主標題：</label><input type="text" class="adm-title-inp" value="${p.title}" style="font-weight:bold; color:var(--primary);"></div>
          <div style="margin-top:8px;"><label class="admin-label">重點粗體字 (highlightText)：</label><input type="text" class="adm-hl-inp" value="${p.highlightText || ''}" placeholder="更重要，是確診之後..."></div>
          <div style="margin-top:8px;"><label class="admin-label">副標題說明：</label><textarea class="adm-sub-inp" style="min-height:45px;">${p.subtitle || ''}</textarea></div>
          <div style="margin-top:8px;">
            <label class="admin-label">圖片網址 (imageUrl) / 支援直接上載：</label>
            <div style="display:flex; gap:6px; align-items:center;">
              <input type="text" id="admPageImg_${realIdx}" class="adm-img-inp" value="${p.imageUrl || ''}" placeholder="https://firebasestorage..." style="flex:1; margin-top:0;">
              <label id="uploadPageLabel_${realIdx}" style="background:#1e3a8a; color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer; white-space:nowrap;">
                📤 上載圖片
                <input type="file" accept="image/*" style="display:none;" onchange="uploadSingleImageToFirebase(this, ${realIdx})">
              </label>
            </div>
          </div>`;
      
      const allOpts = (dbData.options && dbData.options.length > 0) ? dbData.options : defaultDatabase.options;
      const opts = allOpts.filter(o => o.pageId === p.pageId);
      if (opts.length > 0) {
        html += `<div style="margin-top:10px;"><strong style="font-size:12.5px; color:#2c3e50;">🔘 選項清單：</strong><div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">`;
        opts.forEach(o => {
          const oIdx = dbData.options.indexOf(o);
          html += `
            <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:6px; display:flex; gap:6px; align-items:center;">
              <input type="text" style="width:45px;" value="${o.icon}" onchange="dbData.options[${oIdx}].icon=this.value">
              <input type="text" style="flex:1;" value="${o.title}" onchange="dbData.options[${oIdx}].title=this.value">
            </div>`;
        });
        html += `</div></div>`;
      }
      html += `</div>`;
    });
    container.innerHTML = html;
  }

  async function uploadSingleImageToFirebase(input, pageIdx) {
    const file = input.files[0];
    if (!file) return;
    const uploadLabel = document.getElementById(`uploadPageLabel_${pageIdx}`);
    const textInput = document.getElementById(`admPageImg_${pageIdx}`);
    uploadLabel.innerText = "⏳ 上載中...";
    try {
      const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const storageRef = storage.ref(`ci_pages/${Date.now()}_${safeFileName}`);
      const snapshot = await storageRef.put(file);
      const downloadURL = await snapshot.ref.getDownloadURL();
      textInput.value = downloadURL;
      if (dbData.pages[pageIdx]) dbData.pages[pageIdx].imageUrl = downloadURL;
      uploadLabel.innerText = "📤 上載圖片";
      alert("✅ 圖片上傳成功！");
    } catch(err) {
      uploadLabel.innerText = "📤 上載圖片";
      alert("❌ 上傳失敗：" + err.message);
    }
  }

  function addAdminNewCIPage() {
    saveCurrentAdminInputs();
    const selectedRole = document.getElementById('adminRoleSelect').value;
    const count = dbData.pages.filter(p => p.role === selectedRole).length + 1;
    dbData.pages.push({ role: selectedRole, stepOrder: count, pageId: "step_ci_" + Date.now().toString().slice(-4), pageType: "文案", tagName: `0${count}｜自訂步驟`, title: "請在此輸入標題", subtitle: "", imageUrl: "", highlightText: "" });
    renderAdminVisualLayout();
  }

  function deleteAdminCIPage(idx) {
    if (confirm("確定刪除此頁面？")) { dbData.pages.splice(idx, 1); renderAdminVisualLayout(); }
  }

  function renderAdminConfigLayout() {
    const container = document.getElementById('adminConfigContainer');
    if (!container) return;
    const cfg = dbData.config || defaultDatabase.config;
    let html = '<h3 style="color:var(--primary); margin:0 0 12px 0;">⚙️ 系統參數設定</h3><div class="grid-2col">';
    for (const [k, v] of Object.entries(cfg)) html += `<div><label class="admin-label">${k}</label><input type="text" data-adm-config-key="${k}" value="${v}"></div>`;
    html += '</div>';
    container.innerHTML = html;
  }

  function renderAdminRulesLayout() {
    const container = document.getElementById('adminRulesContainer');
    if (!container) return;
    const rules = dbData.rules || defaultDatabase.rules;
    let html = '';
    rules.forEach((rule, idx) => {
      html += `<div style="background:#f8fafc; border:1.5px solid #cbd5e1; border-radius:10px; padding:12px;"><strong style="color:var(--primary);">${rule.name}</strong><input type="text" data-adm-rule-note="${idx}" value="${rule.displayNote || ''}" style="margin-top:4px;"></div>`;
    });
    container.innerHTML = html;
  }

  async function saveAllAdminData() {
    saveCurrentAdminInputs();
    document.querySelectorAll('[data-adm-config-key]').forEach(inp => { dbData.config[inp.dataset.admConfigKey] = inp.value; });
    try {
      const payload = { action: "saveAllAdmin", pages: dbData.pages, options: dbData.options, config: dbData.config, rules: dbData.rules };
      await fetch(GAS_CENTRAL_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      saveToLocalCache({ status: "success", ...payload });
      alert("✅ 設定已成功同步至 Google Sheet 及本地！");
      renderAllDynamicCards();
      closeAdminModal();
    } catch(e) {
      alert("⚠️ 同步失敗，請檢查網路。");
    }
  }

  window.onGASDataLoaded = function(json) {
    if (json && json.status === "success") {
      saveToLocalCache(json);
      applyDatabaseToMemory(json);
      const badge = document.getElementById('sync-status-badge');
      if (badge) { badge.innerHTML = '✅ 中央庫已同步'; badge.className = 'status-ok'; }
      applyRoleMode();
      calculateCIPremium();
    }
  };

  function syncAllFromGASCentral() {
    const hasCache = loadFromLocalCache();
    if (hasCache) {
      const badge = document.getElementById('sync-status-badge');
      if (badge) { badge.innerHTML = '⚡ 已使用本機秒開 (v' + (dbData.config["資料版本"] || '9.7.5') + ')'; badge.className = 'status-ok'; }
      applyRoleMode();
      calculateCIPremium();
    }
    const script = document.createElement('script');
    script.src = GAS_CENTRAL_URL + (GAS_CENTRAL_URL.includes('?') ? '&' : '?') + 'callback=onGASDataLoaded&t=' + Date.now();
    document.body.appendChild(script);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('role') === 'child') ciState.isChildMode = true;
    syncAllFromGASCentral();
  });
</script>
